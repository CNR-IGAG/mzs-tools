name: "🎳 Tester"

on:
  workflow_call:
  push:
    branches:
      - master
    paths:
      - '**.py'
      - .github/workflows/tester.yml
      - pyproject.toml
      - uv.lock
      - mzs_tools/**
      - tests/**

  pull_request:
    branches:
      - master
    paths:
      - '**.py'
      - .github/workflows/tester.yml
      - pyproject.toml
      - uv.lock
      - mzs_tools/**
      - tests/**

env:
  PROJECT_FOLDER: "mzs-tools"


jobs:
  test-all:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # bookworm = Debian 12 with Python 3.11 (3.34 image is frozen, no longer rebuilt upstream)
        # jammy = Ubuntu 22.04 with Python 3.10
        # noble = Ubuntu 24.04 with Python 3.12
        # trixie = Debian 13 with Python 3.13
        # resolute = Ubuntu 26.04 with Python 3.14
        # 3.44 = current LTR (Qt5), supported until the 4.x LTR (4.4.4, ~March 2027) is released
        # stable-* = QGIS 4.4 (Qt6); "stable-questing" is no longer rebuilt (stuck at 4.2.3)
        qgis-version: ["3.34-bookworm", "3.44-jammy", "3.44-noble", "stable-trixie", "stable-resolute"]
        # include:
        #   - qgis-version: "latest"
        #     experimental: true
      max-parallel: 4

    container:
      image: qgis/qgis:${{ matrix.qgis-version }}
      # keep /tmp in RAM: tests create many temporary projects/databases and fsync on the container overlay filesystem is slow.
      # "exec" is required because the uv virtualenv is created in /tmp (tmpfs is noexec by default)
      options: --tmpfs /tmp:exec
      env:
        CI: true
        DISPLAY: ":1"
        MUTE_LOGS: true
        NO_MODALS: 1
        PYTHONPATH: "/usr/share/qgis/python/plugins:/usr/share/qgis/python:."
        QT_QPA_PLATFORM: "offscreen"
        WITH_PYTHON_PEP: false
      # be careful, things have changed since QGIS 3.40. So if you are using this setup
      #  with a QGIS version older than 3.40, you may need to change the way you set up the container
      volumes:
        # Mount the X11 socket to allow GUI applications to run
        - /tmp/.X11-unix:/tmp/.X11-unix
        # Mount the workspace directory to the container
        - ${{ github.workspace }}:/home/root/mzs-tools
        # Use absolute path for local testing with act
        # - /path/to/mzs-tools:/home/root/mzs-tools

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Run tests
        run: >-
          bash /home/root/${{ env.PROJECT_FOLDER }}/tests/run_docker_tests.sh
          ${{ matrix.qgis-version == 'stable-resolute' && '--cov=mzs_tools --cov-report=xml --cov-report=term' || '' }}

      - name: Upload coverage report
        # skipped by act (ACT=true): JavaScript actions need node inside the job container there
        if: ${{ matrix.qgis-version == 'stable-resolute' && !cancelled() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
